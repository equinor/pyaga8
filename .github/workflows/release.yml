# Publish pyaga8 to PyPI when a GitHub release is published.
#
# Release routine (see docs/releasing.md):
# 1. Bump the version in Cargo.toml (and Cargo.lock) in a pull request and merge it.
# 2. Create and publish a GitHub release whose tag equals that version (e.g. 0.2.0).
#
# This workflow then
# - checks that the release tag matches the version in Cargo.toml,
# - runs the full test workflow (tests.yml): it builds the 20 wheels and the sdist once, tests
#   each wheel and the sdist installed in clean virtual environments, and checks the file list,
# - uploads exactly those tested files to PyPI. Only the upload job can read the PyPI token.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Check that the release tag matches Cargo.toml
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        CARGO_VERSION=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['package']['version'])")
        RELEASE_VERSION="${RELEASE_TAG#v}"
        echo "Cargo.toml version: $CARGO_VERSION"
        echo "GitHub release version: $RELEASE_VERSION"
        if [ "$CARGO_VERSION" != "$RELEASE_VERSION" ]; then
          echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match the release tag ($RELEASE_VERSION)"
          exit 1
        fi
        echo "Version check passed"

  tests:
    needs: validate
    uses: ./.github/workflows/tests.yml

  publish:
    needs: [validate, tests]
    runs-on: ubuntu-latest
    steps:
    - name: Download the tested distribution files
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist
    - name: Upload to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        ls -l dist
        test "$(ls dist | wc -l)" -eq 21
        python -m pip install twine
        twine upload dist/*
