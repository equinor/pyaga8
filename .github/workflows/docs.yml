# Build the documentation site (Sphinx, MyST, furo) and publish it on GitHub Pages.
#
# Content: README.md as the landing page, docs/*.md, and the API reference generated from the
# docstrings of the compiled extension (Rust doc comments in src/lib.rs). The extension is
# therefore built and installed before Sphinx runs.
#
# Pull requests build the site with warnings treated as errors and publish nothing.
# Pushes to main (and manual runs on main) build and deploy the site.
# GitHub Pages must be enabled once with Settings -> Pages -> Source: "GitHub Actions".

name: Documentation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.13"
    - name: Build and install pyaga8 with the documentation tools
      env:
        MATURIN_PEP517_ARGS: "--locked"
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[docs]"
    - name: Build the site
      run: sphinx-build -W --keep-going -b html docs docs/_build/html
    - name: Upload the site
      if: github.event_name != 'pull_request'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: docs-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
